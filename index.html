<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un planeta. Seis mundos.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>

        <header class="hero">
            <div>
                <p class="eyebrow"><span></span>Una vuelta al mundo</p>
                <h1>Un planeta.<br><em>Seis mundos.</em></h1>
            </div>
        </header>

        <section class="continents-section">
            <div class="section-heading">
                <p>Elige tu próximo destino</p>
                <span>01 — 06</span>
            </div>

            <div class="continent-grid">

                <a href="javascript:void(0)" class="continent-card">
                    <div class="card-image">
                        <img src="imagenes/africa.avif" alt="Vista aérea de África">
                    </div>
                    <div class="card-content">
                        <div class="card-meta">
                            <p>54 países</p>
                            <p>01</p>
                        </div>
                        <h2>África</h2>
                    </div>
                </a>

                <a href="javascript:void(0)" class="continent-card">
                    <div class="card-image">
                        <img src="imagenes/america.avif" alt="Vista aérea de América">
                    </div>
                    <div class="card-content">
                        <div class="card-meta">
                            <p>35 países</p>
                            <p>02</p>
                        </div>
                        <h2>América</h2>
                    </div>
                </a>

                <a href="javascript:void(0)" class="continent-card">
                    <div class="card-image">
                        <img src="imagenes/asia.avif" alt="Vista aérea de Asia">
                    </div>
                    <div class="card-content">
                        <div class="card-meta">
                            <p>48 países</p>
                            <p>03</p>
                        </div>
                        <h2>Asia</h2>
                    </div>
                </a>

                <a href="javascript:void(0)" class="continent-card">
                    <div class="card-image">
                        <img src="imagenes/europa.avif" alt="Vista aérea de Europa">
                    </div>
                    <div class="card-content">
                        <div class="card-meta">
                            <p>44 países</p>
                            <p>04</p>
                        </div>
                        <h2>Europa</h2>
                    </div>
                </a>

                <a href="javascript:void(0)" class="continent-card">
                    <div class="card-image">
                        <img src="imagenes/oceania.avif" alt="Vista aérea de Oceanía">
                    </div>
                    <div class="card-content">
                        <div class="card-meta">
                            <p>14 países</p>
                            <p>05</p>
                        </div>
                        <h2>Oceanía</h2>
                    </div>
                </a>

                <a href="javascript:void(0)" class="continent-card">
                    <div class="card-image">
                        <img src="imagenes/antartida.avif" alt="Vista aérea de la Antártida">
                    </div>
                    <div class="card-content">
                        <div class="card-meta">
                            <p>El continente blanco</p>
                            <p>06</p>
                        </div>
                        <h2>Antártida</h2>
                    </div>
                </a>

            </div>
        </section>

        <footer>
            <p>Si se pudooooo!!!!!!</p>
        </footer>

    </main>

    <script src="funtion.js"></script>
</body>
</html>
